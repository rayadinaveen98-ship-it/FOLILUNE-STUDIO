name: Studio autonomous engine Stage 1A
on:
  push:
    paths:
      - 'engine/**'
      - 'src/content-model.mjs'
      - 'src/epub-export.mjs'
      - 'tests/**'
      - 'fixtures/autonomous-brief.json'
      - 'fixtures/autonomy-profile.json'
      - '.github/workflows/studio-autonomy-stage1a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Stage 1A autonomous engine with synthetic provider and local HTTP stub
        run: node --test
      - name: Verify real local HTTP creation, review, and publication lockout
        run: python3 tests/server-integration.py
      - name: Verify queue authorization, duplicate prevention, and restart history
        run: python3 tests/queue-integration.py
      - name: Check JavaScript syntax
        run: |
          node --check engine/server.mjs
          node --check engine/model-preflight.mjs
          node --check engine/auto-queue.mjs
          node --check engine/app.js
