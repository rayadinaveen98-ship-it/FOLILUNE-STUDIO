async function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('IndexedDB is unavailable in this browser'));return}const request=indexedDB.open(DB,VERSION);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(STORE))request.result.createObjectStore(STORE,{keyPath:'id'})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('Unable to open local project storage'))})}

function homeHTML(){const sorted=[...projects].sort((a,b)=>b.updatedAt-a.updatedAt);return `<div class="eyebrow">YOUR CREATIVE SANCTUARY</div><div style="display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:27px"><div><h1 class="heading">A world worth creating.</h1><p class="subhead">Every remarkable story begins with a quiet first page.</p></div><button class="btn btn-primary" data-action="new">${icons.plus} New creation</button></div><section class="hero"><div class="hero-copy"><div class="eyebrow">WELCOME TO FOLILUNE STUDIO</div><h1>Give your imagination<br><i>somewhere to live.</i></h1><p>Build stories, shape characters, and collect your best ideas in a thoughtfully crafted workspace.</p><button class="btn btn-primary" data-action="new">Start something new ${icons.arrow}</button></div><div class="art" aria-hidden="true"><div class="orb"></div></div></section><div class="section-head"><h2>Continue creating</h2><button class="subtle-link" data-nav="projects">View projects →</button></div><section class="cardgrid">${sorted.length?sorted.slice(0,3).map(projectCard).join(''):emptyHTML()}</section><div class="section-head"><h2>Thoughtful tools, one workspace</h2></div><div class="tools"><div class="tool-card"><div class="tool-icon">${icons.file}</div><strong>Write with clarity</strong><p>Build your manuscript one chapter, page or illustrated spread at a time.</p></div><div class="tool-card"><div class="tool-icon">${icons.book}</div><strong>Keep your worlds close</strong><p>Record characters, timelines and creative notes beside the writing canvas.</p></div><div class="tool-card"><div class="tool-icon">${icons.lock}</div><strong>Create privately</strong><p>This prototype saves drafts on this device only. Nothing is published.</p></div></div>`}

function editorHTML(){const p=findActive();if(!p){page='projects';return projectsHTML()}const s=getSection();section=s.id;const type=types[p.type];const nWords=p.sections.reduce((n,x)=>n+(x.body.trim()?x.body.trim().split(/\s+/).length:0),0);return `<div class="workspace-title"><div><div class="eyebrow">${esc(type.kicker)} · PRIVATE DRAFT</div><h1>${esc(p.title)}</h1><p class="subhead">Local prototype workspace · Not connected to FOLILUNE Reader</p></div><div class="actions"><button class="btn" data-action="export">${icons.download} Export</button><button class="btn ${mode==='preview'?'btn-primary':''}" data-action="togglePreview">${mode==='preview'?icons.file:icons.eye} ${mode==='preview'?'Back to editing':'Studio preview'}</button><button class="btn btn-primary" data-action="save">${icons.save} Save</button></div></div>${mode==='preview'?previewHTML(p):`<section class="workspace-layout"><aside class="panel"><div class="panelheader"><strong>${esc(type.unit)}s</strong><button class="smallbtn" data-action="addSection" aria-label="Add ${esc(type.unit.toLowerCase())}">+ New</button></div><div class="section-list">${p.sections.map((x,i)=>`<button class="section-row ${x.id===section?'active':''}" data-section="${esc(x.id)}"><span class="section-number">${String(i+1).padStart(2,'0')}</span><span>${esc(x.title||'Untitled')}</span></button>`).join('')}</div><div class="divider"></div><div style="padding:0 17px 17px"><button class="subtle-link alert" data-action="deleteSection">Remove selected ${esc(type.unit.toLowerCase())}</button></div></aside><section class="panel writer"><div class="writer-top"><span>${esc(type.unit)} ${p.sections.findIndex(x=>x.id===s.id)+1} of ${p.sections.length}</span><div class="save-status" id="saveState"><span class="status-dot"></span> Saved locally</div></div><label class="hidden" for="sectionTitle">Section title</label><input class="title-input" id="sectionTitle" maxlength="140" value="${esc(s.title)}" placeholder="Untitled ${esc(type.unit)}"/><textarea class="body-input" id="sectionBody" spellcheck="true" placeholder="${esc(type.body)}">${esc(s.body)}</textarea>${p.type!=='prose'?`<div class="image-stage" id="imageStage">${s.image?`<img alt="${esc(s.alt||'Project illustration')}" src="${s.image}"/>`:`<div class="placeholder">${icons.image}<p style="margin-top:10px">Add artwork for this ${esc(type.unit.toLowerCase())}<br><small>PNG, JPG or WebP, up to 2 MB per image</small></p></div>`}</div><div class="upload-row"><button class="btn" data-action="addImage">${icons.upload} ${s.image?'Replace artwork':'Add artwork'}</button>${s.image?'<button class="btn btn-danger" data-action="removeImage">Remove image</button>':''}</div><label class="fieldlabel" for="imageAlt">Artwork description / accessible text</label><input class="field" id="imageAlt" maxlength="350" value="${esc(s.alt||'')}" placeholder="Describe important visual information"/>`:''}<div class="note-box">${icons.lock} This is an authoring canvas. Reader parity and EPUB/comic export will be tested in a later stage.</div></section><aside class="panel rightpanel"><div class="inspector"><div><h3>Project details</h3><div class="fieldstack"><div><label for="projectTitle" class="fieldlabel">Title</label><input id="projectTitle" maxlength="140" class="field" value="${esc(p.title)}"/></div><div><label for="projectSubtitle" class="fieldlabel">Subtitle</label><input id="projectSubtitle" maxlength="180" class="field" value="${esc(p.subtitle)}" placeholder="Optional subtitle"/></div><div><label for="projectSummary" class="fieldlabel">Synopsis</label><textarea id="projectSummary" class="field" maxlength="1500" placeholder="What is your story about?">${esc(p.summary)}</textarea></div></div></div><div class="divider"></div><div><h3>Story Bible</h3><label class="fieldlabel" for="storyBible">World notes</label><textarea id="storyBible" class="field" style="min-height:150px" maxlength="10000" placeholder="Characters, places, timelines, ideas…">${esc(p.storyBible)}</tex function updateWordCount(){const el=$('#wordCount'),p=findActive();if(el&&p)el.textContent=p.sections.reduce((n,x)=>n+(x.body.trim()?x.body.trim().split(/\s+/).length:0),0)}
async function actions(action){const p=findActive();if(action==='new'){showDialog();return}if(action==='sample'){await makeSample();return}if(action==='import'){$('#importFile').click();return}if(action==='exportAll'){await persist();download('FOLILUNE-Studio-backup.json',JSON.stringify({format:'folilune-studio-backup',version:1,projects},null,2));return}if(action==='export'&&p){await persist();download(filename(p.title)+'.folilune.json',JSON.stringify({format:'folilune-studio-project',version:1,project:p},null,2));return}if(action==='save'){await persist();notify('Draft saved on this device');return}if(action==='togglePreview'){await persist();mode=mode==='preview'?'write':'preview';render();return}if(action==='addSection'&&p){persist();const s=newSection(p.type);s.title=types[p.type].unit+' '+(p.sections.length+1);p.sections.push(s);section=s.id;markChanged();render();return}if(action==='deleteSection'&&p){if(p.sections.length<=1){notify('Keep at least one '+types[p.type].unit.toLowerCase());return}if(!confirm('Remove this '+types[p.type].unit.toLowerCase()+'? This cannot be undone.'))return;p.sections=p.sections.filter(s=>s.id!==section);section=p.sections[0].id;markChanged();render();return}if(action==='deleteProject'&&p){if(!confirm('Permanently delete “'+p.title+'” from this device? Export a backup first if needed.'))return;clearTimeout(saveTimer);writePending=false;try{await tx('delete',p.id);projects=projects.filter(x=>x.id!==p.id);active=null;page='projects';render();notify('Project deleted')}catch(e){notify('Delete failed; project preserved')}return}if(action==='addImage'){$('#imageFile').click();return}if(action==='removeImage'){const s=getSection();if(!s)return;s.image=null;markChanged();render();return}}

function download(name,data){const blob=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);notify('Backup downloaded')}

async function createProject(title,type,language='en',sample=false){let s=newSection(type);let p={id:uid(),type,title:cleanText(title,140),subtitle:'',summary:'',storyBible:'',language,createdAt:Date.now(),updatedAt:Date.now(),sections:[s]};if(sample){p.title='The Night Orchard';p.subtitle='A little fable about courage';p.summary='A child follows an unusual light into a quiet orchard.';p.storyBible='Lena — curious child with a brass lantern.\nThe Orchard — trees bloom only after dark.\nTheme — courage begins with a small choice.';p.sections=[{...newSection('illustrated'),title:'I · The quiet gate',body:'At the end of the village stood an orchard no one entered after sunset. Lena had never believed the stories about it.\n\nOne evening she noticed a tiny golden light among the leaves, blinking like a star that had forgotten the sky.',image:null,alt:''},{...newSection('illustrated'),title:'II · A borrowed light',body:'The light led her to a small fox trapped beneath a fallen branch. Lena set down her lantern, lifted the branch, and watched the fox disappear between the silver trees.\n\nAs she turned to leave, the entire orchard began to glow.',image:null,alt:''}]}

async function importBackup(file){if(!file)return;if(file.size>MAX_IMPORT){notify('Backup is too large for this prototype (8 MB max)');return}let data;try{data=JSON.parse(await file.text())}catch(e){notify('This is not a valid JSON backup');return}let inputs;if(data.format==='folilune-studio-project')inputs=[data.project];else if(data.format==='folilune-studio-backup'&&Array.isArray(data.projects)&&data.projects.length<=100)inputs=data.projects;else{notify('Unknown or unsupported backup format');return}try{const parsed=inputs.map(cleanProject);for(const p of parsed){await tx('put',p);projects.push(p)}page='projects';active=null;render();notify('Imported '+parsed.length+' project(s) as new copies')}catch(e){notify('Import failed; check project data or storage availability')}}
function isValidImage(file){return file&&['image/png','image/jpeg','image/webp'].includes(file.type)&&file.size<=MAX_IMAGE}
